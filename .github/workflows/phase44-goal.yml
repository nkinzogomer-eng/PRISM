name: Phase 4.4 goal-first discovery and evidence gates

on:
  push:
    branches: [research/phase-4-4-goal-directed-discovery]
    paths:
      - "prism/goal_discovery.py"
      - "scripts/phase44_discover.py"
      - "scripts/phase44_evaluate.py"
      - "scripts/phase44_replay.py"
      - "scripts/phase44_replay_evaluate.py"
      - "tests/test_phase44_goals.py"
      - "tests/test_phase44_replay.py"
      - "docs/scm-phase44-goal-protocol.md"
      - ".github/workflows/phase44-goal.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  goal-first:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout PRISM
        uses: actions/checkout@v4

      - name: Checkout frozen OWASP development dataset
        uses: actions/checkout@v4
        with:
          repository: OWASP-Benchmark/BenchmarkPython
          ref: f1291485808b66e20ddb6b01b10dc71b3df8c8ba
          path: benchmark

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Adversarial goal and verification tests
        run: |
          python -m unittest discover -s tests -p 'test_phase44_*.py' -v
          python -m unittest discover -s tests -p 'test_phase43c_property_certificate.py' -v

      - name: Discover candidates WITHOUT labels
        run: |
          python scripts/phase44_discover.py \
            --source-dir benchmark/testcode \
            --output reports/phase44-goal-ci/discovery.json \
            --target-recall 0.8 \
            --max-fpr 0.10

      - name: Report candidate labels only AFTER discovery
        run: |
          python scripts/phase44_evaluate.py \
            --discovery reports/phase44-goal-ci/discovery.json \
            --labels benchmark/expectedresults-0.1.csv \
            --output reports/phase44-goal-ci/development-evaluation.json

      - name: Verify all benchmark instances explicitly accounted for
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path('reports/phase44-goal-ci')
          d=json.loads((p/'discovery.json').read_text())
          e=json.loads((p/'development-evaluation.json').read_text())
          assert d['case_count']==1230
          assert d['verified_vulnerabilities']==0
          assert e['pathtraver']['cases']==168
          assert e['verified_vulnerabilities']==0
          assert e['goal_of_8_verified_of_10'].startswith('NOT MET')
          print('No labels during search; no verified vulnerability claims.')
          print('CWE22 development results',e['pathtraver'])
          PY

      - name: Install local-only Flask replay dependency
        run: python -m pip install Flask==3.1.2

      - name: Smoke test 10 route-specific synthetic sentinel replays
        run: |
          python scripts/phase44_replay.py \
            --source-dir benchmark/testcode \
            --output reports/phase44-goal-ci/replay-smoke.json \
            --limit 10

      - name: Run path traversal replay on all route-selected cases without labels
        run: |
          python scripts/phase44_replay.py \
            --source-dir benchmark/testcode \
            --output reports/phase44-goal-ci/replay-full.json

      - name: Compare replay to labels only AFTER executing all probes
        run: |
          python scripts/phase44_replay_evaluate.py \
            --replay reports/phase44-goal-ci/replay-full.json \
            --labels benchmark/expectedresults-0.1.csv \
            --output reports/phase44-goal-ci/replay-development-evaluation.json

      - name: Preserve source-to-sink candidate ledger and negative results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase44-goal-first-development-only
          path: reports/phase44-goal-ci/
          retention-days: 30
          if-no-files-found: warn
