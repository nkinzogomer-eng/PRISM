name: D2.4 immutable external DeFi corpus provenance gate

on:
  push:
    branches:
      - research/defi-d24-external-corpus-gate
    paths:
      - "benchmarks/defi/d24/**"
      - "scripts/d24_*.py"
      - "tests/test_d24_*.py"
      - ".github/workflows/d24-external-corpus.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  external-preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Adversarial test of immutable corpus and blind-holdout rejection
        run: python -m unittest discover -s tests -p 'test_d24_*.py' -v
      - name: Reproducibly fetch exact external Solidity blobs (read-only)
        run: |
          python -m scripts.d24_external_preflight \
            --manifest benchmarks/defi/d24/external-corpus.json \
            --output reports/d24-ci
      - name: Verify all integrity pins and explicitly reject holdout claim
        run: |
          python - <<'PY'
          from pathlib import Path
          import json
          v=json.loads(Path("reports/d24-ci/preflight.json").read_text())
          assert v["status"]=="INTEGRITY_VERIFIED_NOT_VULNERABILITY_EVALUATED"
          assert v["corpus_is_blind"] is False
          assert len(v["files"])==3
          assert all(f["verified_reproduction"]=="NOT_RUN" for f in v["files"])
          print("D24_PINNED",len(v["files"]))
          print("D24_LEAKAGE_SIGNAL_COUNTS",[f["possible_label_comment_count"] for f in v["files"]])
          print("D24_NO_DETECTION_METRICS_ISSUED")
          PY
      - name: Publish source pinning and contamination records (not source content)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d24-external-source-integrity-preflight
          path: reports/d24-ci/
          retention-days: 30
          if-no-files-found: warn
