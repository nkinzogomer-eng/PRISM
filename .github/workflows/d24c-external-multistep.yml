name: D2.4C pinned external OUSD multistep properties vs independent Foundry

on:
  push:
    branches:
      - research/defi-d24c-accounting-stateful
    paths:
      - "scripts/d24c_*.py"
      - "tests/test_d24c_*.py"
      - "benchmarks/defi/d24c/**"
      - ".github/workflows/d24c-external-multistep.yml"
      - "docs/scm-defi-d24c-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  real-d24c-multistep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout isolated PRISM research
        uses: actions/checkout@v4
      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pinned Foundry v1.3.6
        uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
      - name: Test ABI compiler and adversarial guards
        run: |
          python -m unittest discover -s tests -p 'test_d24c_*.py' -v
      - name: Clone pinned actual OUSD and verify commit
        run: |
          mkdir -p external/origin-dollar
          git -C external/origin-dollar init
          git -C external/origin-dollar remote add origin https://github.com/scfuzzbench/origin-dollar-scfuzzbench.git
          git -C external/origin-dollar fetch --depth 1 origin 299ec6b6bf5401b43efc3e9f7ee5cab3e76167c4
          git -C external/origin-dollar checkout --detach FETCH_HEAD
          test "$(git -C external/origin-dollar rev-parse HEAD)" = "299ec6b6bf5401b43efc3e9f7ee5cab3e76167c4"
          git -C external/origin-dollar submodule update --init --recursive --depth 1
      - name: Compile independent real OUSD ABI
        run: |
          mkdir -p reports/d24c-ci
          cd external/origin-dollar
          /usr/bin/time -v -o ../../reports/d24c-ci/abi-resources.txt \
             forge inspect OUSD abi --json > ../../reports/d24c-ci/ousd-abi.json
          test -s ../../reports/d24c-ci/ousd-abi.json
      - name: Derive frozen generic multistep EVM checks
        run: |
          /usr/bin/time -v -o reports/d24c-ci/property-resources.txt \
            python -m scripts.d24c_accounting_properties \
              --abi reports/d24c-ci/ousd-abi.json \
              --root external/origin-dollar --out reports/d24c-ci
          cp benchmarks/defi/d24c/D24CReference.t.sol \
             external/origin-dollar/test/recon/D24CReference.t.sol
          python - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path("reports/d24c-ci/proposals.json").read_text())
          assert p["status"] == "UNVERIFIED_CANDIDATES"
          assert len(p["candidates"]) == 2 and not p["unknown"]
          assert p["verified_vulnerabilities"] is None
          print("D24C_ABI_CANDIDATES", [x["id"] for x in p["candidates"]])
          PY
      - name: Run matched fuzz reference and stronger stateful reference
        run: |
          /usr/bin/time -v -o reports/d24c-ci/evaluation-resources.txt \
            python -m scripts.d24c_real_evm \
              --root external/origin-dollar \
              --abi reports/d24c-ci/ousd-abi.json \
              --proposals reports/d24c-ci/proposals.json \
              --out reports/d24c-ci
      - name: Assert no fabricated root-cause outcomes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("reports/d24c-ci/evaluation.json").read_text())
          assert result["status"] == "REAL_EVM_MULTI_TX_COMPLETED_UNADJUDICATED"
          assert len(result["runs"]) == 6
          assert result["historical_bugs_tested"] is None
          assert result["comparative_superiority"] is None
          for r in result["runs"]:
              print("D24C_REPRO",r["mode"],r["repeat"],
                    r["wall_seconds"], r["child_cpu_seconds"],
                    [(v["name"],v["status"]) for v in r["outcomes"]])
          PY
      - name: Archive raw external ABI and EVM verification
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: d24c-real-ousd-multistep-results
          path: reports/d24c-ci/
          retention-days: 30
          if-no-files-found: warn
