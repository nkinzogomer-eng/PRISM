name: Phase 4 static baseline

on:
  pull_request:
    branches: [main]
    paths:
      - "scripts/run_phase4_static_baseline.py"
      - "scripts/score_phase4.py"
      - "tests/test_phase4_scoring.py"
      - ".github/workflows/phase4-baseline.yml"
      - "docs/scm-phase4-cyber-protocol.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out PRISM
        uses: actions/checkout@v4

      - name: Check out pinned OWASP Benchmark for Python
        uses: actions/checkout@v4
        with:
          repository: OWASP-Benchmark/BenchmarkPython
          ref: f1291485808b66e20ddb6b01b10dc71b3df8c8ba
          path: benchmark

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install pinned static analyzers
        run: python -m pip install setuptools==80.9.0 bandit==1.8.6 semgrep==1.127.1

      - name: Validate scorer tests
        run: python -m unittest discover -s tests -p 'test_phase4_scoring.py' -v

      - name: Run per-case static baseline
        run: |
          python scripts/run_phase4_static_baseline.py \
            --labels benchmark/expectedresults-0.1.csv \
            --source-dir benchmark/testcode \
            --output-dir reports/phase4-static-baseline

      - name: Upload raw results and summary
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase4-static-baseline
          path: reports/phase4-static-baseline/
          if-no-files-found: warn
          retention-days: 30
