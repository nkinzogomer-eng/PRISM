name: D2.4P autonomous ABI-guided native ETH value search (seeded lab holdout)

on:
  push:
    branches: [research/scm-cyber-d24p-autonomous-native-lab]
    paths:
      - "prism/d24p_probe.py"
      - "scripts/d24p_blind_native.py"
      - "tests/test_d24p_*.py"
      - ".github/workflows/d24p-autonomous-native-blind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-native-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
      - name: Fail-closed unit and adversarial isolation controls
        run: python -m unittest discover -s tests -p 'test_d24p_*.py' -v
      - name: Generate randomized withheld-label ETH vault cohort (no live chains)
        run: |
          python -m scripts.d24p_blind_native generate \
            --out reports/d24p-native-ci --seed "${{ github.run_id }}"
      - name: Prepare autonomous candidate sequences from public ABI ONLY
        run: python -m scripts.d24p_blind_native plan --out reports/d24p-native-ci
      - name: Run actual bounded ETH-balance search on the local Solidity EVM
        run: |
          forge test --root reports/d24p-native-ci \
            --match-contract D24PAutonomousNativeProbe -vv \
            | tee reports/d24p-native-ci/forge-output.txt
      - name: Reveal private labels AFTER EVM execution and grade independently
        run: |
          python -m scripts.d24p_blind_native grade --out reports/d24p-native-ci
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/d24p-native-ci/result.json').read_text())
          assert r['independently_observed_evm_case_count']==21
          assert r['true_positive']==6, r
          assert r['true_negative']==15, r
          assert r['false_positive']==r['false_negative']==0, r
          assert r['native_witness_count']==6, r
          assert r['zero_days']==r['novel_vulnerability_families']==0
          print('D24P_SEEDED_LAB_ONLY_NOT_ZERO_DAY',r)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d24p-seeded-lab-native-witness-and-controls
          path: reports/d24p-native-ci/
          retention-days: 30
          if-no-files-found: warn
