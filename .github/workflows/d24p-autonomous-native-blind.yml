name: D2.4P autonomous ABI-guided native ETH value search (seeded lab holdout)

on:
  push:
    branches: [research/scm-cyber-d24p-autonomous-native-lab]
    paths:
      - "prism/d24p_probe.py"
      - "scripts/d24p_blind_native.py"
      - "tests/test_d24p_*.py"
      - ".github/workflows/d24p-autonomous-native-blind.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bounded-native-holdout:
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: v1.3.6
      - name: Fail-closed unit and adversarial isolation controls
        run: python -m unittest discover -s tests -p 'test_d24p_*.py' -v
      - name: Three fresh-seed blind-generation, ABI-only search and native-EVM rounds
        run: |
          set -o pipefail
          for offset in 0 1 2; do
            case_dir="reports/d24p-native-ci/round${offset}"
            seed=$(( ${{ github.run_id }} + offset * 65537 ))
            python -m scripts.d24p_blind_native generate --out "$case_dir" --seed "$seed"
            python -m scripts.d24p_blind_native plan --out "$case_dir"
            forge test --root "$case_dir" \
              --match-contract D24PAutonomousNativeProbe -vv \
              | tee "$case_dir/forge-output.txt"
            python -m scripts.d24p_blind_native grade --out "$case_dir"
          done
      - name: Enforce matched positive/negative controls and hard scientific limits
        run: |
          python -m scripts.d24p_blind_native aggregate --out reports/d24p-native-ci
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path('reports/d24p-native-ci/aggregate.json').read_text())
          assert r['rounds']==3 and r['independent_native_ethereum_case_observations']==63
          assert r['true_positive']==18, r
          assert r['true_negative']==45, r
          assert r['false_positive']==r['false_negative']==0, r
          assert r['zero_days']==r['novel_classes']==r['real_world_vulnerabilities']==0
          print('D24P_SEEDED_LAB_ONLY_NOT_ZERO_DAY',r)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: d24p-seeded-lab-native-witness-and-controls
          path: reports/d24p-native-ci/
          retention-days: 30
          if-no-files-found: warn
